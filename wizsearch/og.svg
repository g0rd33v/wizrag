      <rect x="90" y="4" width="79" height="10" rx="5" fill="url(#bar)"/>
      <text x="345" y="13" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e5e5e5">762</text>
    </g>

    <g transform="translate(0, 120)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="13" fill="#888">demo 02</text>
      <rect x="90" y="4" width="240" height="10" rx="5" fill="#121212"/>
      <rect x="90" y="4" width="5" height="10" rx="2.5" fill="url(#bar)"/>
      <text x="345" y="13" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e5e5e5">49</text>
