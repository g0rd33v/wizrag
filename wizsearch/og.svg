    <text x="0" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#666">CHAT</text>
    <text x="120" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#666">COMMIT</text>
    <text x="240" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#666">SEARCH</text>
