      <circle cx="25" cy="22" r="5" fill="none" stroke="#d4d4d4" stroke-width="2"/>
      <circle cx="25" cy="48" r="5" fill="none" stroke="#d4d4d4" stroke-width="2"/>
      <circle cx="50" cy="35" r="5" fill="none" stroke="#d4d4d4" stroke-width="2"/>
      <path d="M25 27 L25 43 M30 22 L45 30" stroke="#d4d4d4" stroke-width="2" fill="none"/>
