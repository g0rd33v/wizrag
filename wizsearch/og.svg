  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#1a1a1a">
    <circle cx="100" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="400" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/><circle cx="600" cy="100" r="1.5"/><circle cx="700" cy="100" r="1.5"/><circle cx="800" cy="100" r="1.5"/><circle cx="900" cy="100" r="1.5"/><circle cx="1000" cy="100" r="1.5"/><circle cx="1100" cy="100" r="1.5"/>
    <circle cx="100" cy="530" r="1.5"/><circle cx="200" cy="530" r="1.5"/><circle cx="300" cy="530" r="1.5"/><circle cx="400" cy="530" r="1.5"/><circle cx="500" cy="530" r="1.5"/><circle cx="600" cy="530" r="1.5"/><circle cx="700" cy="530" r="1.5"/><circle cx="800" cy="530" r="1.5"/><circle cx="900" cy="530" r="1.5"/><circle cx="1000" cy="530" r="1.5"/><circle cx="1100" cy="530" r="1.5"/>
