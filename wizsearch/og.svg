      <rect x="12" y="18" width="46" height="38" rx="3" fill="none" stroke="#d4d4d4" stroke-width="2"/>
      <path d="M12 28 L58 28" stroke="#d4d4d4" stroke-width="2"/>
      <circle cx="28" cy="42" r="5" fill="none" stroke="#d4d4d4" stroke-width="2"/>
      <path d="M32 46 L37 51" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round"/>
