<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WizSearch — Anthropic Agent Skills</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-hover: #1c1c1c;
    --ink: #fafafa;
    --ink-dim: #8a8a8a;
    --ink-faint: #555;
    --rule: #222;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 18vh 24px 120px;
  }
  .container {
    width: 100%;
    max-width: 620px;
  }
  .brand {
    text-align: center;
    margin-bottom: 36px;
  }
  .brand-name {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
  }
  .brand-name strong { color: var(--ink); font-weight: 600; }
  .search-box {
    position: relative;
    margin-bottom: 24px;
  }
  .search-box input {
    width: 100%;
    font-family: inherit;
    font-size: 18px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 18px 52px 18px 22px;
    outline: none;
    transition: border-color 150ms ease, background 150ms ease;
  }
  .search-box input:hover { background: var(--surface-hover); }
  .search-box input:focus {
    border-color: var(--accent);
    background: var(--surface-hover);
  }
  .search-box input::placeholder { color: var(--ink-faint); }
  .search-box .kbd {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--ink-faint);
    font-family: 'SF Mono', Menlo, monospace;
    pointer-events: none;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 2px 6px;
    background: var(--bg);
  }
  .history {
    margin-top: 36px;
  }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 10px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--rule);
  }
  .history-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .history-clear {
    font-size: 12px;
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 0;
    font-family: inherit;
  }
  .history-clear:hover { color: var(--ink-dim); }
  .history-empty {
    color: var(--ink-faint);
    font-size: 13px;
    padding: 14px 2px;
    font-style: italic;
  }
  .history-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    transition: color 120ms ease;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item:hover { color: var(--ink); }
  .history-query {
    flex: 1;
    color: var(--ink-dim);
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-item:hover .history-query { color: var(--ink); }
  .history-time {
    color: var(--ink-faint);
    font-size: 12px;
    flex-shrink: 0;
  }
  .history-remove {
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 4px 6px;
    font-size: 16px;
    line-height: 1;
    opacity: 0;
    transition: opacity 120ms ease, color 120ms ease;
  }
  .history-item:hover .history-remove { opacity: 1; }
  .history-remove:hover { color: var(--ink); }
  .footer {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }
  .footer .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-name"><strong>WizSearch</strong> — Anthropic Agent Skills</div>
    </div>

    <form class="search-box" id="search-form" autocomplete="off">
      <input id="q" type="text" placeholder="Search everything…" autofocus spellcheck="false" />
      <span class="kbd">↵</span>
    </form>

    <section class="history" aria-label="Search history">
      <div class="history-header">
        <span class="history-label">Recent searches</span>
        <button class="history-clear" id="clear-history" type="button" style="display:none;">Clear all</button>
      </div>
      <ul class="history-list" id="history-list"></ul>
      <div class="history-empty" id="history-empty">No searches yet. Type above and hit enter.</div>
    </section>
  </div>

  <div class="footer"><span class="dot"></span>Step 1 · minimal shell · no index yet</div>

<script>
(function () {
  'use strict';

  const LS_KEY = 'wizsearch-step1-history';
  const MAX_HISTORY = 20;

  const form = document.getElementById('search-form');
  const input = document.getElementById('q');
  const listEl = document.getElementById('history-list');
  const emptyEl = document.getElementById('history-empty');
  const clearBtn = document.getElementById('clear-history');

  // ---------- history storage ----------
  function loadHistory() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }
  function saveHistory(arr) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch (e) {}
  }
  function addToHistory(query) {
    const q = query.trim();
    if (!q) return;
    let arr = loadHistory();
    // Dedupe — bump existing to top
    arr = arr.filter(item => item.q.toLowerCase() !== q.toLowerCase());
    arr.unshift({ q: q, t: Date.now() });
    if (arr.length > MAX_HISTORY) arr = arr.slice(0, MAX_HISTORY);
    saveHistory(arr);
    render();
  }
  function removeFromHistory(query) {
    const arr = loadHistory().filter(item => item.q !== query);
    saveHistory(arr);
    render();
  }
  function clearAllHistory() {
    saveHistory([]);
    render();
  }

  // ---------- time formatting ----------
  function formatTime(ts) {
    const now = Date.now();
    const diff = now - ts;
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h';
    if (diff < 604800000) return Math.floor(diff / 86400000) + 'd';
    const d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  // ---------- render ----------
  function render() {
    const arr = loadHistory();
    listEl.innerHTML = '';
    if (arr.length === 0) {
      emptyEl.style.display = '';
      clearBtn.style.display = 'none';
      return;
    }
    emptyEl.style.display = 'none';
    clearBtn.style.display = '';

    for (const item of arr) {
      const li = document.createElement('li');
      li.className = 'history-item';

      const q = document.createElement('span');
      q.className = 'history-query';
      q.textContent = item.q;
      q.addEventListener('click', () => {
        input.value = item.q;
        input.focus();
        addToHistory(item.q); // bump to top
      });

      const t = document.createElement('span');
      t.className = 'history-time';
      t.textContent = formatTime(item.t);

      const x = document.createElement('button');
      x.className = 'history-remove';
      x.type = 'button';
      x.textContent = '×';
      x.setAttribute('aria-label', 'Remove from history');
      x.addEventListener('click', (e) => {
        e.stopPropagation();
        removeFromHistory(item.q);
      });

      li.appendChild(q);
      li.appendChild(t);
      li.appendChild(x);
      listEl.appendChild(li);
    }
  }

  // ---------- handlers ----------
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    addToHistory(q);
    // Step 1 is just the shell — no results yet. Visual feedback only.
    input.blur();
    input.focus();
    input.select();
  });

  clearBtn.addEventListener('click', () => {
    clearAllHistory();
  });

  render();
})();
</script>
</body>
</html>
