<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WizSearch — Anthropic Agent Skills</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" defer></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-hover: #1c1c1c;
    --ink: #fafafa;
    --ink-dim: #8a8a8a;
    --ink-faint: #555;
    --rule: #222;
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.55;
    min-height: 100vh;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: 10vh 24px 120px;
  }
  .container { width: 100%; max-width: 720px; }
  .brand { text-align: center; margin-bottom: 32px; }
  .brand-name {
    font-size: 14px; font-weight: 500; letter-spacing: 0.02em;
    color: var(--ink-dim);
  }
  .brand-name strong { color: var(--ink); font-weight: 600; }
  .brand-stats {
    margin-top: 8px;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .brand-stats .loading { color: var(--ink-faint); }
  .brand-stats .ready { color: var(--accent); }

  .search-box { position: relative; margin-bottom: 24px; }
  .search-box input {
    width: 100%;
    font-family: inherit; font-size: 18px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 14px; padding: 18px 52px 18px 22px;
    outline: none;
    transition: border-color 150ms ease, background 150ms ease;
  }
  .search-box input:hover:not(:disabled) { background: var(--surface-hover); }
  .search-box input:focus:not(:disabled) {
    border-color: var(--accent); background: var(--surface-hover);
  }
  .search-box input:disabled { opacity: 0.6; cursor: wait; }
  .search-box input::placeholder { color: var(--ink-faint); }
  .search-box .kbd {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--ink-faint);
    font-family: 'SF Mono', Menlo, monospace;
    pointer-events: none;
    border: 1px solid var(--rule); border-radius: 4px;
    padding: 2px 6px; background: var(--bg);
  }

  /* Results */
  .results { margin-top: 24px; }
  .results-header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 10px; margin-bottom: 4px;
    border-bottom: 1px solid var(--rule);
  }
  .results-count {
    font-size: 11px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .results-clear {
    font-size: 12px; background: none; border: none;
    color: var(--ink-faint); cursor: pointer; padding: 0;
    font-family: inherit;
  }
  .results-clear:hover { color: var(--ink-dim); }
  .result {
    padding: 18px 2px;
    border-bottom: 1px solid var(--rule);
  }
  .result-title {
    display: block;
    font-size: 15px; font-weight: 600; color: var(--ink);
    margin-bottom: 6px; text-decoration: none;
    line-height: 1.35;
  }
  .result-title:hover { color: var(--accent); }
  .result-meta {
    font-size: 12px; color: var(--ink-faint);
    margin-bottom: 8px;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .result-topic {
    display: inline-block;
    background: var(--accent-soft); color: var(--accent);
    padding: 2px 8px; border-radius: 3px;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.02em;
  }
  .result-source { color: var(--ink-dim); }
  .result-source a { color: inherit; text-decoration: none; }
  .result-source a:hover { color: var(--accent); }
  .result-text {
    color: var(--ink-dim); font-size: 14px; line-height: 1.55;
    max-height: 4.4em; overflow: hidden;
    position: relative;
  }
  .result-text mark {
    background: var(--accent-soft); color: var(--ink);
    padding: 0 2px; border-radius: 2px;
  }

  /* History (only when no active search) */
  .history { margin-top: 36px; }
  .history-header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 10px; margin-bottom: 4px;
    border-bottom: 1px solid var(--rule);
  }
  .history-label {
    font-size: 11px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .history-clear {
    font-size: 12px; background: none; border: none;
    color: var(--ink-faint); cursor: pointer; padding: 0;
    font-family: inherit;
  }
  .history-clear:hover { color: var(--ink-dim); }
  .history-empty {
    color: var(--ink-faint); font-size: 13px;
    padding: 14px 2px; font-style: italic;
  }
  .history-list { list-style: none; margin: 0; padding: 0; }
  .history-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
  }
  .history-item:last-child { border-bottom: none; }
  .history-query {
    flex: 1; color: var(--ink-dim); font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .history-item:hover .history-query { color: var(--ink); }
  .history-time { color: var(--ink-faint); font-size: 12px; flex-shrink: 0; }
  .history-remove {
    background: none; border: none; color: var(--ink-faint);
    cursor: pointer; padding: 4px 6px; font-size: 16px; line-height: 1;
    opacity: 0; transition: opacity 120ms ease, color 120ms ease;
  }
  .history-item:hover .history-remove { opacity: 1; }
  .history-remove:hover { color: var(--ink); }

  .footer {
    position: fixed; bottom: 18px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: var(--ink-faint); letter-spacing: 0.04em;
  }
  .footer .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-right: 6px; vertical-align: middle;
  }

  /* Topic chips */
  .topics {
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
  }
  .topics-label {
    font-size: 11px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-dim);
    margin-bottom: 14px;
  }
  .topics-grid {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .topic-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    padding: 7px 12px;
    border-radius: 999px;
    font-family: inherit; font-size: 13px;
    cursor: pointer;
    transition: all 120ms ease;
  }
  .topic-chip:hover {
    background: var(--surface-hover);
    border-color: var(--ink-faint);
    color: var(--ink);
  }
  .topic-chip .count {
    font-size: 11px; color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .topic-chip:hover .count { color: var(--ink-dim); }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-name"><strong>WizSearch</strong> — Anthropic Agent Skills</div>
      <div class="brand-stats" id="stats"><span class="loading">Loading index…</span></div>
    </div>

    <form class="search-box" id="search-form" autocomplete="off">
      <input id="q" type="text" placeholder="Loading…" spellcheck="false" disabled />
      <span class="kbd">↵</span>
    </form>

    <!-- Results area — only visible when there's an active query -->
    <section class="results hidden" id="results-section">
      <div class="results-header">
        <span class="results-count" id="results-count"></span>
        <button class="results-clear" id="results-clear" type="button">Clear</button>
      </div>
      <div id="results-list"></div>
    </section>

    <!-- Topics — only visible when idle -->
    <section class="topics hidden" id="topics-section" aria-label="Topics">
      <div class="topics-label">Browse by topic</div>
      <div class="topics-grid" id="topics-grid"></div>
    </section>

    <!-- History area — only visible when idle -->
    <section class="history" id="history-section" aria-label="Search history">
      <div class="history-header">
        <span class="history-label">Recent searches</span>
        <button class="history-clear" id="clear-history" type="button" style="display:none;">Clear all</button>
      </div>
      <ul class="history-list" id="history-list"></ul>
      <div class="history-empty" id="history-empty">No searches yet. Type above and hit enter.</div>
    </section>
  </div>

  <div class="footer"><span class="dot"></span>Step 4 · topic chips · 190 chunks</div>

<script>
(function () {
  'use strict';

  // ---------- state ----------
  const LS_KEY = 'wizsearch-step4-history';
  const MAX_HISTORY = 20;
  const MANIFEST_URL = 'wizindex-manifest.json';

  let ALL_CHUNKS = [];
  let FUSE = null;
  let INDEX_READY = false;

  const form = document.getElementById('search-form');
  const input = document.getElementById('q');
  const statsEl = document.getElementById('stats');
  const resultsSection = document.getElementById('results-section');
  const resultsListEl = document.getElementById('results-list');
  const resultsCountEl = document.getElementById('results-count');
  const resultsClearBtn = document.getElementById('results-clear');
  const historySection = document.getElementById('history-section');
  const historyListEl = document.getElementById('history-list');
  const historyEmptyEl = document.getElementById('history-empty');
  const historyClearBtn = document.getElementById('clear-history');

  // ---------- history ----------
  function loadHistory() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }
  function saveHistory(arr) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch {}
  }
  function addToHistory(q) {
    q = q.trim();
    if (!q) return;
    let arr = loadHistory();
    arr = arr.filter(x => x.q.toLowerCase() !== q.toLowerCase());
    arr.unshift({ q: q, t: Date.now() });
    if (arr.length > MAX_HISTORY) arr = arr.slice(0, MAX_HISTORY);
    saveHistory(arr);
    renderHistory();
  }
  function removeFromHistory(q) {
    saveHistory(loadHistory().filter(x => x.q !== q));
    renderHistory();
  }
  function clearAllHistory() {
    saveHistory([]);
    renderHistory();
  }
  function formatTime(ts) {
    const d = Date.now() - ts;
    if (d < 60000) return 'just now';
    if (d < 3600000) return Math.floor(d / 60000) + 'm';
    if (d < 86400000) return Math.floor(d / 3600000) + 'h';
    if (d < 604800000) return Math.floor(d / 86400000) + 'd';
    const dt = new Date(ts);
    return (dt.getMonth() + 1) + '/' + dt.getDate();
  }
  function renderHistory() {
    const arr = loadHistory();
    historyListEl.innerHTML = '';
    if (arr.length === 0) {
      historyEmptyEl.style.display = '';
      historyClearBtn.style.display = 'none';
      return;
    }
    historyEmptyEl.style.display = 'none';
    historyClearBtn.style.display = '';
    for (const item of arr) {
      const li = document.createElement('li');
      li.className = 'history-item';
      const q = document.createElement('span');
      q.className = 'history-query';
      q.textContent = item.q;
      q.addEventListener('click', () => {
        input.value = item.q;
        runSearch();
      });
      const t = document.createElement('span');
      t.className = 'history-time';
      t.textContent = formatTime(item.t);
      const x = document.createElement('button');
      x.className = 'history-remove';
      x.type = 'button';
      x.textContent = '×';
      x.setAttribute('aria-label', 'Remove from history');
      x.addEventListener('click', (e) => {
        e.stopPropagation();
        removeFromHistory(item.q);
      });
      li.appendChild(q); li.appendChild(t); li.appendChild(x);
      historyListEl.appendChild(li);
    }
  }

  // ---------- index loading ----------
  async function loadIndex() {
    statsEl.innerHTML = '<span class="loading">Loading manifest…</span>';
    const mRes = await fetch(MANIFEST_URL + '?v=' + Date.now(), { cache: 'no-cache' });
    if (!mRes.ok) throw new Error('manifest HTTP ' + mRes.status);
    const manifest = await mRes.json();

    statsEl.innerHTML = '<span class="loading">Loading ' + manifest.shards.length + ' shards…</span>';
    const bust = '?v=' + Date.now();
    const shards = await Promise.all(
      manifest.shards.map(s =>
        fetch(s.chunks_url + bust, { cache: 'no-cache' })
          .then(r => r.ok ? r.json() : { chunks: [] })
          .catch(() => ({ chunks: [] }))
      )
    );

    ALL_CHUNKS = [];
    for (const s of shards) {
      for (const c of (s.chunks || [])) ALL_CHUNKS.push(c);
    }

    statsEl.innerHTML = '<span class="loading">Indexing…</span>';
    // Let the browser paint before the Fuse build
    await new Promise(r => setTimeout(r, 0));

    // Truncate text to 400 chars for Fuse only (keep full text on the chunk for display)
    for (const c of ALL_CHUNKS) {
      c._search_text = (c.text || '').slice(0, 400);
    }

    FUSE = new Fuse(ALL_CHUNKS, {
      keys: [
        { name: 'title',         weight: 0.30 },
        { name: 'keywords',      weight: 0.25 },
        { name: 'synonyms',      weight: 0.15 },
        { name: 'alt_phrasings', weight: 0.10 },
        { name: 'topic',         weight: 0.08 },
        { name: '_search_text',  weight: 0.12 }
      ],
      includeScore: true,
      includeMatches: true,
      threshold: 0.4,
      ignoreLocation: true,
      minMatchCharLength: 3
    });

    INDEX_READY = true;
    statsEl.innerHTML = '<span class="ready">' + manifest.stats.chunks +
      ' chunks · ' + manifest.stats.sources + ' sources · ' +
      manifest.stats.topics + ' topics · ready</span>';
    input.disabled = false;
    input.placeholder = 'Search everything…';
    input.focus();

    // Render topic chips from the manifest
    renderTopics(manifest.topics || []);

    // If the URL has ?q= on load, run that search automatically
    syncFromURL({ fromPopState: true });
  }

  function renderTopics(topics) {
    const el = document.getElementById('topics-grid');
    const sec = document.getElementById('topics-section');
    if (!topics || topics.length === 0) return;
    const sorted = [...topics].sort((a, b) =>
      (b.chunk_count || 0) - (a.chunk_count || 0)
    );
    el.innerHTML = '';
    for (const t of sorted) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'topic-chip';
      chip.title = t.description || '';
      const name = document.createElement('span');
      name.textContent = t.name;
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = t.chunk_count;
      chip.appendChild(name);
      chip.appendChild(count);
      chip.addEventListener('click', () => {
        input.value = t.name;
        runSearch();
      });
      el.appendChild(chip);
    }
    sec.classList.remove('hidden');
  }

  // ---------- search ----------
  const SCORE_CUTOFF = 0.38;
  const MAX_RESULTS = 25;

  function runSearch(opts) {
    if (!INDEX_READY || !FUSE) return;
    const q = input.value.trim();
    if (!q) {
      clearResults();
      return;
    }
    addToHistory(q);

    const raw = FUSE.search(q, { limit: 80 });
    const matches = raw.filter(m => m.score <= SCORE_CUTOFF).slice(0, MAX_RESULTS);
    renderResults(q, matches);

    // Push URL state so the search is deep-linkable. `pushState` for user-
    // initiated searches so browser Back/Forward works; `replaceState` for
    // restores from popstate so we don't double-stack history.
    if (!opts || !opts.fromPopState) {
      const url = new URL(location.href);
      if (url.searchParams.get('q') !== q) {
        url.searchParams.set('q', q);
        history.pushState({ q: q }, '', url);
      }
    }
  }

  function clearResults(opts) {
    resultsSection.classList.add('hidden');
    historySection.classList.remove('hidden');
    const topicsSec = document.getElementById('topics-section');
    if (topicsSec && topicsSec.childElementCount > 0) topicsSec.classList.remove('hidden');
    input.value = '';
    input.focus();
    if (!opts || !opts.fromPopState) {
      const url = new URL(location.href);
      if (url.searchParams.has('q')) {
        url.searchParams.delete('q');
        history.pushState({}, '', url);
      }
    }
  }

  resultsClearBtn.addEventListener('click', clearResults);

  // ---------- rendering ----------
  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }
  function highlight(text, query) {
    const safe = escapeHtml(text);
    if (!query) return safe;
    const tokens = query.split(/\s+/).filter(t => t.length >= 3);
    if (tokens.length === 0) return safe;
    const re = new RegExp('(' + tokens.map(t =>
      t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    ).join('|') + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  }
  function snippet(text, query, maxLen = 240) {
    // Find first match of a query token to center the snippet around
    if (!query) return (text || '').slice(0, maxLen);
    const tokens = query.toLowerCase().split(/\s+/).filter(t => t.length >= 3);
    const lower = (text || '').toLowerCase();
    let idx = -1;
    for (const t of tokens) {
      const i = lower.indexOf(t);
      if (i >= 0 && (idx < 0 || i < idx)) idx = i;
    }
    if (idx < 0) return (text || '').slice(0, maxLen);
    const start = Math.max(0, idx - 60);
    const end = Math.min(text.length, start + maxLen);
    let snip = text.slice(start, end);
    if (start > 0) snip = '…' + snip;
    if (end < text.length) snip = snip + '…';
    return snip;
  }

  function renderResults(query, matches) {
    resultsListEl.innerHTML = '';
    historySection.classList.add('hidden');
    const topicsSec = document.getElementById('topics-section');
    if (topicsSec) topicsSec.classList.add('hidden');
    resultsSection.classList.remove('hidden');

    if (matches.length === 0) {
      resultsCountEl.textContent = 'No matches for "' + query + '"';
      const empty = document.createElement('div');
      empty.className = 'result';
      empty.style.color = 'var(--ink-faint)';
      empty.innerHTML = 'Try a different phrasing, or fewer words.';
      resultsListEl.appendChild(empty);
      return;
    }

    resultsCountEl.textContent = matches.length +
      ' match' + (matches.length === 1 ? '' : 'es') + ' for "' + query + '"';

    for (const m of matches) {
      const c = m.item;
      const article = document.createElement('article');
      article.className = 'result';

      // Title links out to source
      const title = document.createElement('a');
      title.className = 'result-title';
      title.href = c.source || '#';
      title.target = '_blank';
      title.rel = 'noopener';
      title.innerHTML = highlight(c.title || 'Untitled', query);

      // Meta: topic chip + source label
      const meta = document.createElement('div');
      meta.className = 'result-meta';
      const topic = document.createElement('span');
      topic.className = 'result-topic';
      topic.textContent = c.topic || 'Untitled topic';
      const source = document.createElement('span');
      source.className = 'result-source';
      if (c.source) {
        const a = document.createElement('a');
        a.href = c.source;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = c.source_label || c.source;
        source.appendChild(a);
      } else {
        source.textContent = c.source_label || '';
      }
      meta.appendChild(topic);
      meta.appendChild(source);

      // Snippet — centered on first query-token match, highlighted
      const body = document.createElement('div');
      body.className = 'result-text';
      body.innerHTML = highlight(snippet(c.text, query, 240), query);

      article.appendChild(title);
      article.appendChild(meta);
      article.appendChild(body);
      resultsListEl.appendChild(article);
    }
  }

  // ---------- form ----------
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    runSearch();
  });
  historyClearBtn.addEventListener('click', clearAllHistory);

  // Escape key clears results
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !resultsSection.classList.contains('hidden')) {
      clearResults();
    }
  });

  // ---------- URL state ----------
  function syncFromURL(opts) {
    const urlQ = new URL(location.href).searchParams.get('q') || '';
    if (urlQ) {
      input.value = urlQ;
      runSearch({ fromPopState: true });
    } else {
      clearResults({ fromPopState: true });
    }
  }
  window.addEventListener('popstate', () => syncFromURL({ fromPopState: true }));

  // ---------- boot ----------
  renderHistory();

  function startWhenFuseReady() {
    if (typeof Fuse === 'undefined') {
      setTimeout(startWhenFuseReady, 30);
      return;
    }
    loadIndex().catch(err => {
      console.error('loadIndex failed:', err);
      statsEl.innerHTML = '<span style="color:#e67;">Index failed to load: ' + escapeHtml(err.message) + '</span>';
      input.placeholder = 'Index unavailable';
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startWhenFuseReady, { once: true });
  } else {
    startWhenFuseReady();
  }
})();
</script>
</body>
</html>
